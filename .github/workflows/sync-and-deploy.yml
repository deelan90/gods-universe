name: Sync Astronomical Archives & Deploy GitHub Pages

on:
  push:
    branches: ['main']
  schedule:
    # Full catalog sync (exoplanets, stars, satellites, deep sky) every 3 days
    - cron: '0 6 */3 * *'
    # Live refresh (spacecraft positions, Mars weather, space-station orbits) every 6 hours
    - cron: '23 */6 * * *'
  # Allow manual 1-click sync & deploy from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-sync'
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync fresh NASA Exoplanets, Satellites & Catalogs (3-day schedule or manual run)
        if: (github.event_name == 'schedule' && github.event.schedule == '0 6 */3 * *') || github.event_name == 'workflow_dispatch'
        run: |
          npm run sync-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): auto-sync astronomical archives & newly discovered worlds"
            git push origin HEAD:main
          else
            echo "Catalogs already up to date."
          fi

      # Runs on every build. Results ship in the deployed site only (not committed),
      # so the 6-hourly refresh does not add commits to the repo.
      - name: Refresh live spacecraft positions, Mars weather & station orbits
        continue-on-error: true
        run: npm run sync-live

      - name: Build production web observatory
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-pages:
    needs: build-and-sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
